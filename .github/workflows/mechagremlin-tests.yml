name: MechaGremlin focused tests
on:
  push:
    branches: [develop, main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  curve-studio:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-studio.txt
      - name: Curve math and Qt interaction tests
        run: python -m unittest discover -s tests_mechagremlin -v
      - name: Focused regression tests
        shell: pwsh
        run: |
          if (Test-Path tests_feedback) {
            python -m unittest discover -s tests_feedback -v
            exit $LASTEXITCODE
          }
      - name: Check entrypoint syntax
        run: python -m py_compile gremlinEx.py
